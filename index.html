<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Find Your Travel Mood | KarmicJourneys</title>
<style>
  :root{
    --teal:#2a9d8f;
    --teal-light:#e6f6f4;
    --coral:#f4845f;
    --purple:#8e7cc3;
    --bg:#faf9f7;
    --bubble-user:#2a9d8f;
    --bubble-bot:#ffffff;
    --text-dark:#2b2b2b;
    --text-muted:#8a8a8a;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#fdf6f0 0%,#f4f8f7 100%);

    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,0.08);
  }
  header{
    padding:18px 20px 14px;
    background:linear-gradient(135deg,var(--teal) 0%,#238176 100%);
    color:white;
    border-radius:0 0 20px 20px;
    position:sticky;
    top:0;
    z-index:10;
  }
  header .brand{
    font-size:15px;
    font-weight:700;
    letter-spacing:0.3px;
    opacity:0.95;
  }
  header .title{
    font-size:19px;
    font-weight:700;
    margin-top:2px;
  }
  .progress-wrap{
    margin-top:12px;
  }
  .progress-label{
    font-size:12px;
    opacity:0.9;
    margin-bottom:6px;
  }
  .progress-bar{
    height:6px;
    background:rgba(255,255,255,0.3);
    border-radius:6px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:white;
    border-radius:6px;
    transition:width 0.4s ease;
  }
  .chat{
    flex:1;
    padding:20px 16px 100px;
    display:flex;
    flex-direction:column;
    gap:12px;
    overflow-y:auto;
  }
  .bubble-row{
    display:flex;
    animation:fadeIn 0.35s ease both;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .bubble-row.bot{justify-content:flex-start;}
  .bubble-row.user{justify-content:flex-end;}
  .bubble{
    max-width:80%;
    padding:12px 16px;
    border-radius:var(--radius);
    font-size:15px;
    line-height:1.4;
  }
  .bubble.bot{
    background:var(--bubble-bot);
    border:1px solid #eee;
    border-bottom-left-radius:4px;
    box-shadow:0 2px 6px rgba(0,0,0,0.03);
  }
  .bubble.user{
    background:var(--bubble-user);
    color:white;
    border-bottom-right-radius:4px;
  }
  .bubble.reaction{
    background:var(--teal-light);
    color:#1d6d63;
    font-weight:600;
    border-bottom-left-radius:4px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:4px;
    animation:fadeIn 0.4s ease both;
  }
  .option-btn{
    background:white;
    border:1.5px solid var(--teal);
    color:var(--teal);
    padding:12px 16px;
    border-radius:14px;
    font-size:14.5px;
    font-weight:600;
    text-align:left;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .option-btn:hover, .option-btn:active{
    background:var(--teal);
    color:white;
  }
  .typing{

    gap:4px;
    padding:14px 16px;
    background:white;
    border:1px solid #eee;
    border-radius:var(--radius);
    border-bottom-left-radius:4px;
    width:fit-content;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:#bbb;
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:0.15s;}
  .typing span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0);}
    30%{transform:translateY(-5px);}
  }

    background:white;
    border-radius:22px;

  }

    color:var(--text-muted);

/* =========================================================================
   APP LOGIC — no need to edit below this line for content changes
   ========================================================================= */

const chatEl = document.getElementById("chat");
const progressFill = document.getElementById("progressFill");
const progressLabel = document.getElementById("progressLabel");

let stageIndex = 0;
let questionIndexInStage = 0;
let profile = {}; // key -> {value, tags}
let totalQuestionsAnswered = 0;
const totalQuestions = STAGES.reduce((sum, s) => sum + s.questions.length, 0);

function scrollToBottom(){
  window.scrollTo({top: document.body.scrollHeight, behavior:"smooth"});
}

function addBotBubble(text, extraClass){
  const row = document.createElement("div");
  row.className = "bubble-row bot";
  const bubble = document.createElement("div");
  bubble.className = "bubble bot" + (extraClass ? " " + extraClass : "");
  bubble.textContent = text;
  row.appendChild(bubble);
  chatEl.appendChild(row);
  scrollToBottom();
}

function addUserBubble(text){
  const row = document.createElement("div");
  row.className = "bubble-row user";
  const bubble = document.createElement("div");
  bubble.className = "bubble user";
  bubble.textContent = text;
  row.appendChild(bubble);
  chatEl.appendChild(row);
  scrollToBottom();
}

function showTyping(){
  const row = document.createElement("div");
  row.className = "bubble-row bot";
  row.id = "typingRow";
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = "<span></span><span></span><span></span>";
  row.appendChild(typing);
  chatEl.appendChild(row);
  scrollToBottom();
}

function removeTyping(){
  const row = document.getElementById("typingRow");
  if(row) row.remove();
}

function updateProgress(){
  const pct = Math.round((totalQuestionsAnswered / totalQuestions) * 100);
  progressFill.style.width = pct + "%";
  const currentStage = STAGES[stageIndex];
  progressLabel.textContent = currentStage ? currentStage.stageLabel : "All done!";
}

// Reorder Stage 2 scenery options based on Stage 1 mood answer
function getOrderedOptions(question){
  const mood = profile.mood ? profile.mood.value : null;
  if(!mood) return question.options;
  const opts = [...question.options];
  opts.sort((a,b) => {
    const aPri = a.moodPriority && a.moodPriority.includes(mood) ? 0 : 1;
    const bPri = b.moodPriority && b.moodPriority.includes(mood) ? 0 : 1;
    return aPri - bPri;
  });
  return opts;
}

function renderQuestion(){
  updateProgress();
  const stage = STAGES[stageIndex];
  if(!stage){
    renderSummary();
    return;
  }
  const question = stage.questions[questionIndexInStage];

  showTyping();
  setTimeout(() => {
    removeTyping();
    addBotBubble(question.text);

    const optsRow = document.createElement("div");
    optsRow.className = "bubble-row bot";
    const optsWrap = document.createElement("div");
    optsWrap.className = "options";
    optsWrap.style.maxWidth = "85%";

    const orderedOptions = getOrderedOptions(question);
    orderedOptions.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = opt.label;
      btn.onclick = () => handleAnswer(question, opt);
      optsWrap.appendChild(btn);
    });

    optsRow.appendChild(optsWrap);
    chatEl.appendChild(optsRow);
    scrollToBottom();
  }, 550);
}

function handleAnswer(question, option){
  // remove option buttons once chosen
  const allOptionRows = chatEl.querySelectorAll(".bubble-row.bot .options");
  allOptionRows.forEach(el => el.closest(".bubble-row").remove());

  addUserBubble(option.label);
  profile[question.key] = { value: option.value, tags: option.tags || [] };
  totalQuestionsAnswered++;

  const reaction = REACTIONS[Math.floor(Math.random() * REACTIONS.length)];

  showTyping();
  setTimeout(() => {
    removeTyping();
    addBotBubble(reaction, "reaction");

    setTimeout(() => {
      questionIndexInStage++;
      const stage = STAGES[stageIndex];
      if(questionIndexInStage >= stage.questions.length){
        stageIndex++;
        questionIndexInStage = 0;
      }
      renderQuestion();
    }, 500);
  }, 500);
}

function scoreDestination(dest){
  const allTags = Object.values(profile).flatMap(p => p.tags || []);
  let score = 0;
  allTags.forEach(tag => {
    if(dest.tags.includes(tag)) score++;
  });
  // domestic/international is a hard filter, not just a scoring tag
  const scope = profile.scope ? profile.scope.value : null;
  if(scope === "Domestic" && !dest.tags.includes("domestic")) score -= 100;
  if(scope === "International" && !dest.tags.includes("international")) score -= 100;
  return score;
}

function pickDestinations(){
  const scored = DESTINATIONS.map(d => ({...d, score: scoreDestination(d)}))
    .sort((a,b) => b.score - a.score);
  // pick top 2 that are meaningfully different (avoid picking near-duplicates)
  const picks = [scored[0]];
  for(let i = 1; i < scored.length; i++){
    if(scored[i].name !== picks[0].name){
      picks.push(scored[i]);
      break;
    }
  }
  return picks;
}

function buildWhatsAppMessage(){
  const lines = [
    "Hi! I just completed the KarmicJourneys Travel Mood Finder. Here's my profile:",
    "",
    `Mood: ${profile.mood?.value || "-"}`,
    `Scenery: ${profile.scenery?.value || "-"}`,
    `Travelling as: ${profile.party?.value || "-"}`,
    `Scope: ${profile.scope?.value || "-"}`,
    `Distance comfort: ${profile.distanceTolerance?.value || "-"}`,
    `Pace: ${profile.pace?.value || "-"}`,
    `Stay style: ${profile.stayStyle?.value || "-"}`,
    `Duration: ${profile.duration?.value || "-"}`,
    `Budget: ${profile.budget?.value || "-"}`,
    "",
    "Can you suggest some options for me?"
  ];
  return encodeURIComponent(lines.join("\n"));
}

function renderSummary(){
  progressLabel.textContent = "All done! 🎉";
  progressFill.style.width = "100%";

  showTyping();
  setTimeout(() => {
    removeTyping();
    addBotBubble("All set! Here's your travel profile ✨");

    const card = document.createElement("div");
    card.className = "summary-card";

    const destinations = pickDestinations();

    card.innerHTML = `
      <h2>Your Travel Profile</h2>
      <div class="sub">Based on everything you told us</div>
      <ul class="summary-list">
        <li><span class="emoji">🎯</span> ${profile.mood?.value} trip, drawn to ${profile.scenery?.value?.toLowerCase()}</li>
        <li><span class="emoji">👥</span> Travelling as ${profile.party?.value?.toLowerCase()} · ${profile.scope?.value}</li>
        <li><span class="emoji">🛏️</span> ${profile.pace?.value} · ${profile.stayStyle?.value} stays · ${profile.duration?.value}, ${profile.budget?.value} budget</li>
      </ul>
      <div class="dest-title">Suggested for you</div>
      ${destinations.map(d => `
        <div class="dest-card">
          <div class="name">${d.name}</div>
          <div class="hook">${d.hook}</div>
        </div>
      `).join("")}
      <a class="wa-btn" href="https://wa.me/${WHATSAPP_NUMBER}?text=${buildWhatsAppMessage()}" target="_blank">
        📲 Send my travel profile on WhatsApp
      </a>
      <div class="restart-link" onclick="location.reload()">Start over</div>
    `;

    chatEl.appendChild(card);
    scrollToBottom();
  }, 600);
}

// Kick things off
renderQuestion();
</script>
